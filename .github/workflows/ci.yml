name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-and-smoke-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build images
        run: docker compose build

      - name: Start services
        run: docker compose up -d

      - name: Wait for backend ready
        run: |
          for i in $(seq 1 30); do
            echo "Attempt $i/30: checking http://localhost:8080/api/note/list ..."
            if curl -f -s http://localhost:8080/api/note/list > /dev/null; then
              echo "Backend is ready!"
              exit 0
            fi
            sleep 10
          done
          echo "Backend did not become ready in time"
          docker compose logs
          exit 1

      - name: Smoke test - /api/note/list
        run: |
          echo "=== Response from /api/note/list ==="
          curl -f http://localhost:8080/api/note/list
          echo ""
          echo "=== Smoke test passed! ==="

      - name: Tear down
        if: always()
        run: docker compose down -v
