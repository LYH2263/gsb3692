name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  build-and-smoke:
    name: Build images & smoke test /api/note/list
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Prepare .env from .env.example
        run: cp .env.example .env

      - name: Build three service images via docker compose
        run: docker compose build db backend frontend

      - name: Start stack with docker compose
        run: docker compose up -d

      - name: Wait for backend to become healthy
        run: |
          echo "Waiting for backend health..."
          for i in $(seq 1 60); do
            status=$(docker inspect --format='{{.State.Health.Status}}' $(docker compose ps -q backend) 2>/dev/null || echo "starting")
            echo "[$i] backend health: $status"
            if [ "$status" = "healthy" ]; then
              echo "Backend is healthy."
              exit 0
            fi
            sleep 5
          done
          echo "Backend did not become healthy in time."
          docker compose ps
          docker compose logs backend
          exit 1

      - name: Smoke test - curl /api/note/list
        run: |
          set -e
          echo "Hitting http://localhost:8080/api/note/list ..."
          http_code=$(curl -s -o response.json -w "%{http_code}" http://localhost:8080/api/note/list)
          echo "HTTP status: $http_code"
          echo "Response body:"
          cat response.json
          echo
          if [ "$http_code" != "200" ]; then
            echo "Smoke test failed: expected HTTP 200, got $http_code"
            exit 1
          fi

      - name: Dump compose logs on failure
        if: failure()
        run: |
          docker compose ps || true
          docker compose logs --no-color || true

      - name: Tear down
        if: always()
        run: docker compose down -v
